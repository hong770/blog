{% if pages and pages > 1 %}
<nav class="pagination">
  {% if page > 1 %}
    <a href="?page={{ page - 1 }}">← 上一頁</a>
  {% else %}
    <span></span>
  {% endif %}
  <span>第 {{ page }} / {{ pages }} 頁</span>
  {% if page < pages %}
    <a href="?page={{ page + 1 }}">下一頁 →</a>
  {% else %}
    <span></span>
  {% endif %}
</nav>
{% endif %}
