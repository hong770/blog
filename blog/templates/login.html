{% extends "base.html" %}
{% block title %}管理員登入｜我的小站{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">ADMIN LOGIN</p>
  <h1>管理員登入</h1>
  <p class="muted">登入後可直接新增文章、編輯內容與管理相簿。</p>
  <form method="post" class="form-stack">
    <label>帳號
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>密碼
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="button" type="submit">登入後台</button>
  </form>
</div>
{% endblock %}
